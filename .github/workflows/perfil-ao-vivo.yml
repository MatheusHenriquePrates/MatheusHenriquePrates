name: Perfil ao vivo

# Gera a cobrinha das contribuições e o cartão de números, e publica os dois no ramo "output",
# que o README do perfil usa. Roda todo dia e quando o robô, o gerador ou as fontes mudam.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/perfil-ao-vivo.yml", ".github/scripts/**", "assets/fontes/**"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cartão de números
        run: node .github/scripts/numeros.mjs dist/numeros.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
      - name: Cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=#2da44e
            dist/cobrinha-escura.svg?palette=github-dark&color_snake=#39d353
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
