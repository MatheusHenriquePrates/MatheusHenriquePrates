name: Cobrinha das contribuições

# Gera o gráfico de contribuições animado (a cobrinha) e publica no ramo "output",
# que o README do perfil usa. Roda todo dia e quando este arquivo muda.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, proposta]
    paths: [".github/workflows/cobrinha.yml"]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?color_snake=#2da44e
            dist/cobrinha-escura.svg?palette=github-dark&color_snake=#39d353
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
